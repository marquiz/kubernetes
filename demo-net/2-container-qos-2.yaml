apiVersion: v1
kind: Pod
metadata:
  name: demo2
spec:
  qosResources:
  - name: net
    class: fast

  containers:
  - name: cnt-1
    image: k8s.gcr.io/pause
    resources:
      qosResources:
      - name: rdt
        class: bronze

  - name: cnt-2
    image: k8s.gcr.io/pause
    resources:
      qosResources:
      - name: rdt
        class: gold
      - name: blockio
        class: max-prio
