apiVersion: v1
kind: Pod
metadata:
  name: demo
spec:
  containers:
  - name: cnt-1
    image: k8s.gcr.io/busybox
    command:
      - "/bin/sh"
      - "-c"
    args:
      - |
        cat /etc/hosts;
        while :; do date; sleep 10; done
    resources:
      requests:
        cpu: 100m
      limits:
        cpu: 200m
    volumeMounts:
      - name: empty-volume
        mountPath: /mnt

  - name: cnt-2
    image: k8s.gcr.io/busybox
    command:
      - "/bin/sh"
      - "-c"
    args:
      - |
        cat /etc/hosts;
        while :; do date; sleep 10; done
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
    volumeMounts:
      - name: host-volume
        mountPath: /host/marquiz

  volumes:
    - name: empty-volume
      emptyDir:

    - name: host-volume
      hostPath:
        path: /var/tmp/marquiz
        type: Directory
